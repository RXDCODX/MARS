syntax = "proto3";

package mars.twitch;

option csharp_namespace = "MARS.Shared.Contracts.Twitch.Control";

import "google/protobuf/empty.proto";

service TwitchControlService {
  rpc GetFullUserByLogin (GetUserByLoginRequest) returns (TwitchUser);
  rpc SendChatMessage (TwitchChatSendRequest) returns (BoolResult);
  rpc GrantVip (TwitchVipGrantRequest) returns (BoolResult);
  rpc RefundReward (RewardRefundRequest) returns (BoolResult);
  rpc RecordMiniGameResult (MiniGameResultRequest) returns (BoolResult);
  rpc GetLeaderboardTop (GetLeaderboardTopRequest) returns (LeaderboardTopResponse);
  rpc GetUserStats (GetUserStatsRequest) returns (LeaderboardStatsResponse);
  rpc GetConnectionState (google.protobuf.Empty) returns (TwitchConnectionState);
  rpc GetStreamTitle (google.protobuf.Empty) returns (StreamTitleResponse);
  rpc ChangeStreamTitle (ChangeStreamTitleRequest) returns (BoolResult);
  rpc AddBlacklistedUser (BlacklistUserRequest) returns (TwitchUser);
  rpc RemoveBlacklistedUser (BlacklistUserRequest) returns (BoolResult);
  rpc Reconnect (google.protobuf.Empty) returns (BoolResult);
  rpc NotifyMissingTwitchToken (google.protobuf.Empty) returns (BoolResult);
  rpc ExecuteAutoMessage (google.protobuf.Empty) returns (StringResult);
  rpc TestHelloVideo (HelloVideoRequest) returns (StringResult);
  rpc CancelMiniGames (google.protobuf.Empty) returns (BoolResult);
  rpc TogglePuntoSwitcher (google.protobuf.Empty) returns (BoolResult);
  rpc GetEventSubSubscriptions (google.protobuf.Empty) returns (StringResult);
  rpc ResubscribeEventSub (google.protobuf.Empty) returns (StringResult);
  rpc TimeoutUser (TimeoutUserRequest) returns (BoolResult);
  rpc JoinChannelAndSend (JoinChannelAndSendRequest) returns (BoolResult);
}

message GetUserByLoginRequest {
  string login = 1;
}

message TwitchUser {
  string twitch_id = 1;
  string user_login = 2;
  string display_name = 3;
  string profile_image_url = 4;
  string chat_color = 5;
  bool is_moderator = 6;
  bool is_vip = 7;
}

message TwitchChatSendRequest {
  string channel = 1;
  string message = 2;
  string reply_to = 3;
}

message TwitchVipGrantRequest {
  string user_id = 1;
}

message RewardRefundRequest {
  string reward_id = 1;
  repeated string redemption_ids = 2;
  string reason = 3;
}

message MiniGameResultRequest {
  string game = 1;
  string user_id = 2;
  string user_name = 3;
  bool with_waifu = 4;
}

message ChangeStreamTitleRequest {
  string title = 1;
}

message BlacklistUserRequest {
  string input = 1;
}

message StreamTitleResponse {
  string title = 1;
}

message HelloVideoRequest {
  string name = 1;
  string color = 2;
}

message TimeoutUserRequest {
  string user_id = 1;
}

message JoinChannelAndSendRequest {
  string channel = 1;
  string message = 2;
}

message StringResult {
  string text = 1;
  bool success = 2;
}

message BoolResult {
  bool success = 1;
}

message GetLeaderboardTopRequest {
  int32 count = 1;
}

message LeaderboardEntry {
  string twitch_id = 1;
  string display_name = 2;
  int32 total_wins = 3;
  int32 russian_roulette_wins = 4;
  int32 trivia_wins = 5;
}

message LeaderboardTopResponse {
  repeated LeaderboardEntry entries = 1;
}

message GetUserStatsRequest {
  string twitch_id = 1;
}

message LeaderboardStatsResponse {
  int32 place = 1;
  LeaderboardEntry user = 2;
  bool has_user = 3;
}

message TwitchConnectionState {
  bool is_event_sub_connected = 1;
  bool is_twitch_chat_connected = 2;
  string joined_channels = 3;
  string last_connected_at = 4;
  string last_disconnected_at = 5;
  string last_disconnect_reason = 6;
  int32 reconnect_attempts = 7;
  bool is_reconnecting = 8;
}