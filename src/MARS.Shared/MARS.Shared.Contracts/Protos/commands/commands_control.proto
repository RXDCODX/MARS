syntax = "proto3";

package mars.commands;

option csharp_namespace = "MARS.Shared.Contracts.Commands.Control";


service CommandsControlService {
  rpc Invoke (InvokeCommandRequest) returns (InvokeCommandResponse);
}

message InvokeCommandRequest {
  string command_name = 1;
  string input = 2;
}

message CommandAttachment {
  int32 kind = 1;
  string url = 2;
  string caption = 3;
}

message InvokeCommandResponse {
  bool success = 1;
  string text = 2;
  repeated CommandAttachment attachments = 3;
  string job_id = 4;
  int32 error_code = 5;
}