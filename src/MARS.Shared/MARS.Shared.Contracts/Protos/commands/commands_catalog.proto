syntax = "proto3";

package mars.commands.catalog;

option csharp_namespace = "MARS.Shared.Contracts.Commands.Catalog";

service CommandsCatalogService {
  rpc GetTelegramCommands (GetTelegramCommandsRequest) returns (TelegramCommandsResponse);
  rpc SearchInlineCommands (SearchInlineCommandsRequest) returns (InlineCommandsResponse);
}

message GetTelegramCommandsRequest {
  string user_id = 1;
  bool is_admin = 2;
  repeated string roles = 3;
  string language_code = 4;
}

message TelegramCommand {
  string name = 1;
  string description = 2;
  repeated string aliases = 3;
  bool is_admin = 4;
  bool supports_inline = 5;
}

message TelegramCommandsResponse {
  repeated TelegramCommand commands = 1;
  string catalog_version = 2;
}

message SearchInlineCommandsRequest {
  string user_id = 1;
  bool is_admin = 2;
  repeated string roles = 3;
  string query = 4;
  int32 limit = 5;
}

message InlineCommand {
  string id = 1;
  string title = 2;
  string description = 3;
  string command_text = 4;
  string preview_url = 5;
}

message InlineCommandsResponse {
  repeated InlineCommand results = 1;
  int32 cache_time_seconds = 2;
}