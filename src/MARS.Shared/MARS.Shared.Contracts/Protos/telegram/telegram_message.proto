syntax = "proto3";

import "google/protobuf/empty.proto";

package mars.telegrammessage;

option csharp_namespace = "MARS.Shared.Contracts.TelegramMessage";

service TelegramMessageService {
  rpc Send (SendMessageRequest) returns (SendMessageReply);
  rpc GetGooglePhotosAuthorizationUrl (google.protobuf.Empty) returns (GooglePhotosAuthorizationUrlReply);
  rpc SetRandomMemEnabled (RandomMemEnabledRequest) returns (google.protobuf.Empty);
  rpc GetWhitelist (google.protobuf.Empty) returns (WhitelistReply);
  rpc GetWTelegramStatus (google.protobuf.Empty) returns (WTelegramStatusReply);
}

message SendMessageRequest {
  int64 chat_id = 1;
  string text = 2;
}

message SendMessageReply {
  bool delivered = 1;
}

message GooglePhotosAuthorizationUrlReply {
  string url = 1;
}

message RandomMemEnabledRequest {
  bool enabled = 1;
}

message WhitelistReply {
  repeated string users = 1;
}

message WTelegramStatusReply {
  string status = 1;
}
