syntax = "proto3";

package mars.soundrequest;

option csharp_namespace = "MARS.Shared.Contracts.SoundRequest.Control";

import "google/protobuf/empty.proto";

service SoundRequestControlService {
  rpc MuteAll (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc UnmuteAll (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc GetRandomTrack (google.protobuf.Empty) returns (AudioQuizTrack);
  rpc GetUserQueuePosition (UserRequest) returns (StringResult);
  rpc GetCurrentSong (google.protobuf.Empty) returns (StringResult);
  rpc PausePlayback (google.protobuf.Empty) returns (StringResult);
  rpc ResumePlayback (google.protobuf.Empty) returns (StringResult);
  rpc StopPlayback (google.protobuf.Empty) returns (StringResult);
  rpc StartSpotifyAuthorization (SpotifyAuthStartRequest) returns (StringResult);
  rpc AddTrack (AddTrackRequest) returns (StringResult);
  rpc AddPlaylist (AddPlaylistRequest) returns (StringResult);
  rpc ClearQueue (google.protobuf.Empty) returns (StringResult);
  rpc CancelLastTrack (CancelLastTrackRequest) returns (StringResult);
  rpc SetVolume (SetVolumeRequest) returns (StringResult);
}

message AddTrackRequest {
  string query = 1;
  string requested_by_twitch_id = 2;
}

message AddPlaylistRequest {
  string playlist_url = 1;
  string requested_by_twitch_id = 2;
  int32 max_tracks = 3;
}

message CancelLastTrackRequest {
  string twitch_id = 1;
}

message SetVolumeRequest {
  optional int32 volume = 1;
}

message SpotifyAuthStartRequest {
  string redirect_uri = 1;
}

message UserRequest {
  string twitch_id = 1;
}

message StringResult {
  string text = 1;
  bool success = 2;
}

message AudioQuizTrack {
  string url = 1;
  string artwork_url = 2;
  string title = 3;
  int32 duration_seconds = 4;
}