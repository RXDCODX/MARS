syntax = "proto3";

package mars.audiocontroller;

option csharp_namespace = "MARS.Shared.Contracts.AudioController";

import "google/protobuf/empty.proto";

service AudioControllerService {
  rpc MuteMixer (MuteMixerRequest) returns (MuteMixerResponse);
  rpc UnmuteMixer (google.protobuf.Empty) returns (UnmuteMixerResponse);
  rpc GetMutedSessions (google.protobuf.Empty) returns (MutedSessionsResponse);
  rpc GetMicrophoneVolume (google.protobuf.Empty) returns (MicrophoneVolumeResponse);
  rpc SetMicrophoneVolume (SetMicrophoneVolumeRequest) returns (MicrophoneVolumeSetResponse);
  rpc SetMicrophoneVolumeToMax (google.protobuf.Empty) returns (MicrophoneVolumeSetResponse);
}

message MuteMixerRequest {
  repeated string excluded_process_names = 1;
}

message MuteMixerResponse {
  int32 muted_session_count = 1;
  repeated string muted_process_names = 2;
}

message UnmuteMixerResponse {
  int32 unmuted_session_count = 1;
}

message MutedSession {
  uint32 process_id = 1;
  string process_name = 2;
  string display_name = 3;
}

message MutedSessionsResponse {
  repeated MutedSession sessions = 1;
}

message MicrophoneVolumeResponse {
  float volume = 1;
  string volume_percent = 2;
  bool is_muted = 3;
  bool is_at_maximum = 4;
  string device_name = 5;
}

message SetMicrophoneVolumeRequest {
  float volume = 1;
}

message MicrophoneVolumeSetResponse {
  float previous_volume = 1;
  string previous_volume_percent = 2;
  float current_volume = 3;
  string current_volume_percent = 4;
  string message = 5;
}