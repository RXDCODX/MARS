name: mars

# Все учётные данные приходят из переменных окружения, которые compose берёт из .env
# (в репозитории лежит .env.example с рабочими dev-значениями, поэтому `docker compose up`
# поднимает стек без ручного создания секретов). Прод-значения задаются в своём .env.

x-service-defaults: &service-defaults
  build:
    context: .
  expose: ["8080"]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  # Общая часть окружения. ConnectionStrings здесь намеренно нет: у каждого
  # сервиса своя база и своя роль, поэтому строка подключения задаётся в
  # секции конкретного сервиса. Общий DefaultConnection раздавал бы всем
  # сервисам права суперпользователя postgres на одну базу — изоляция, ради
  # которой всё затевалось, отменялась бы одним общим якорем.
  environment: &service-env
    ASPNETCORE_ENVIRONMENT: Production
    RabbitMq__Host: rabbitmq
    RabbitMq__Port: "5672"
    RabbitMq__UserName: ${RABBITMQ_USER:-mars}
    RabbitMq__Password: ${RABBITMQ_PASSWORD:-mars}
    ServiceAuth__ApiKey: ${SERVICE_API_KEY:-mars-dev-service-key}
    ApplicationInsights__ConnectionString: ${APPINSIGHTS_CONNECTION_STRING:-}
    Otlp__Endpoint: http://tempo:4317
  # Логи приложений в Loki доставляет Alloy: он читает stdout контейнеров через
  # Docker-демон, а сами сервисы никуда логи не шлют. Поэтому переменных
  # Loki__Url и Seq__Url здесь больше нет — их читал только AddMarsLogging,
  # а доставкой занимается внешний агент.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s
  networks:
    - mars-network

services:
  # ─── Infrastructure ────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mars}
      POSTGRES_USER: ${POSTGRES_USER:-mars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mars}
      # Пароли ролей сервисов. Их читает infrastructure/db-init/01-databases.sh
      # при инициализации тома и подставляет в CREATE ROLE. Пустое значение
      # там останавливает скрипт до любых изменений.
      MARS_TWITCH_PASSWORD: ${MARS_TWITCH_PASSWORD:-}
      MARS_WAIFU_PASSWORD: ${MARS_WAIFU_PASSWORD:-}
      MARS_CHAT_PASSWORD: ${MARS_CHAT_PASSWORD:-}
      MARS_MEDIA_PASSWORD: ${MARS_MEDIA_PASSWORD:-}
      MARS_SCOREBOARD_PASSWORD: ${MARS_SCOREBOARD_PASSWORD:-}
      MARS_CINEMA_PASSWORD: ${MARS_CINEMA_PASSWORD:-}
      MARS_MEDIASTORAGE_PASSWORD: ${MARS_MEDIASTORAGE_PASSWORD:-}
      MARS_ADMIN_PASSWORD: ${MARS_ADMIN_PASSWORD:-}
      MARS_ALERTS_PASSWORD: ${MARS_ALERTS_PASSWORD:-}
      MARS_VIDEOS365_PASSWORD: ${MARS_VIDEOS365_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Скрипты выполняются официальным entrypoint'ом только на пустом томе.
      # Файл помечен executable — иначе entrypoint его пропустит.
      - ./infrastructure/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mars} -d ${POSTGRES_DB:-mars}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mars-network

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      # Без явных RABBITMQ_DEFAULT_* брокер поднимается как guest/guest и режет
      # любые не-локальные AMQP-подключения (ACCESS_REFUSED).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mars}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mars}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - mars-network

# ─── Gateway ───────────────────────────────────────────────
  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.Gateway/Dockerfile
    ports:
      - "9155:8080"
    depends_on:
      twitch-core: { condition: service_healthy }
      admin: { condition: service_healthy }
      # Без этого корневой маршрут Gateway отдавал бы 502 первые секунды после
      # подъёма, пока nginx ещё не смонтировал собранный клиент.
      client-ui: { condition: service_healthy }

  # Клиент MARS.Gateway: оверлеи, админка и сайт. Отдельный блок без
  # <<: *service-defaults намеренно: якорь протащил бы .NET-окружение,
  # depends_on на postgres и rabbitmq и healthcheck по curl на :8080, которых у
  # nginx нет. Наружу не публикуется — единственный порт у Gateway.
  client-ui:
    build:
      context: .
      dockerfile: src/MARS.Gateway/ClientApp.Dockerfile
    expose: ["80"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - mars-network

    # ─── Core Services ─────────────────────────────────────────
  twitch-core:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.TwitchCore/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__TwitchDb: "Host=postgres;Database=mars_twitch;Username=mars_twitch;Password=${MARS_TWITCH_PASSWORD}"
      # Twitch API. Без OAuth сервис стартует и работает, но подключение к чату
      # откладывается (см. TwitchConnectionManager.TryCreateCredentials).
      Twitch__ClientId: ${TWITCH_CLIENT_ID:-}
      Twitch__Secret: ${TWITCH_SECRET:-}
      Twitch__OAuth: ${TWITCH_OAUTH:-}

  waifu-gacha:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.WaifuGacha/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__WaifuDb: "Host=postgres;Database=mars_waifu;Username=mars_waifu;Password=${MARS_WAIFU_PASSWORD}"

  telegram:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.Telegram/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__ChatDb: "Host=postgres;Database=mars_chat;Username=mars_chat;Password=${MARS_CHAT_PASSWORD}"

  discord:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.Discord/Dockerfile

  commands:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.Commands/Dockerfile

  sound-request:
    <<: *service-defaults
    # 8081 — gRPC: Kestrel обслуживает HTTP/2 без TLS только на отдельном
    # порту с явно заданным протоколом Http2 (см. AddMarsGrpcHosting).
    expose: ["8080", "8081"]
    build:
      context: .
      dockerfile: src/MARS.SoundRequest/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__MediaDb: "Host=postgres;Database=mars_media;Username=mars_media;Password=${MARS_MEDIA_PASSWORD}"

  tts:
    <<: *service-defaults
    # 8081 — gRPC: Kestrel обслуживает HTTP/2 без TLS только на отдельном
    # порту с явно заданным протоколом Http2 (см. AddMarsGrpcHosting).
    expose: ["8080", "8081"]
    build:
      context: .
      dockerfile: src/MARS.TTS/Dockerfile

  obs:
    <<: *service-defaults
    # 8081 — gRPC: Kestrel обслуживает HTTP/2 без TLS только на отдельном
    # порту с явно заданным протоколом Http2 (см. AddMarsGrpcHosting).
    expose: ["8080", "8081"]
    build:
      context: .
      dockerfile: src/MARS.OBS/Dockerfile
    # Том общий для obs, alerts и media-storage: конвейер «алерт → файл»
    # пересекает эти три контейнера, и потеря тома рвёт его. TestAlertsController,
    # который был первым читателем Alerts/ и faces/ отсюда, удалён вместе с
    # отладочной отправкой; том остался за остальными потребителями.
    volumes:
      - mars-wwwroot:/app/wwwroot

  videos365:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.Videos365/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__Videos365Db: "Host=postgres;Database=mars_videos365;Username=mars_videos365;Password=${MARS_VIDEOS365_PASSWORD}"
      # Конвейер запускается только при полной конфигурации: без логина и
      # пароля источника обход дедупликации помечает видео «загружено», которого
      # в канале нет.
      Config365__Site: "${CONFIG365_SITE:-}"
      Config365__Login: "${CONFIG365_LOGIN:-}"
      Config365__Password: "${CONFIG365_PASSWORD:-}"
      Config365__TelegramChannelId: "${CONFIG365_TELEGRAM_CHANNEL_ID:-0}"
      # Уведомление администраторам о недоступности источника. Без токена
      # сервис стартует, а уведомление пропускается с предупреждением в логе.
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__AdminIds__0: "${TELEGRAM_ADMIN_ID:-}"

  shikimori:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.Shikimori/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__ShikimoriDb: "Host=postgres;Database=mars_shikimori;Username=mars_shikimori;Password=${MARS_SHIKIMORI_PASSWORD}"
      # Реквизиты приложения Shikimori API. Без них сервис стартует, но
      # каждый запрос к Shikimori будет отклонён как анонимный.
      Shikimori__ClientName: "${SHIKIMORI_CLIENT_NAME:-}"
      Shikimori__ClientId: "${SHIKIMORI_CLIENT_ID:-}"
      Shikimori__ClientSecret: "${SHIKIMORI_CLIENT_SECRET:-}"
      Shikimori__ShikimoriSite: "${SHIKIMORI_SITE:-https://shikimori.one}"

  alerts:
    <<: *service-defaults
    # 8081 — gRPC: Kestrel обслуживает HTTP/2 без TLS только на отдельном
    # порту с явно заданным протоколом Http2 (см. AddMarsGrpcHosting).
    expose: ["8080", "8081"]
    build:
      context: .
      dockerfile: src/MARS.Alerts/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__AlertsDb: "Host=postgres;Database=mars_alerts;Username=mars_alerts;Password=${MARS_ALERTS_PASSWORD}"
      # Список каналов, которые WTelegram читает после переезда. Перенесён из
      # legacy-таблицы WTelegramAlloweedChannels, которую удаляет миграция
      # 20260930192816_SeedLegacyChat; пустое значение остановит чтение канала.
      WTelegram__AllowedChannelIds__0: "${WTELGRAM_ALLOWED_CHANNEL_IDS:-}"
    # Аудит: alerts пишет медиа (RandomMemHandler, PyroAlertsHelper) и читает
    # Alerts/faces, но тома mars-wwwroot не видел — файлы оставались в
    # ephemeral-слое контейнера, и media-storage их не отдавал. Общий том
    # обязателен, иначе конвейер «скачал алерт → отдал файл» разорван.
    volumes:
      - mars-wwwroot:/app/wwwroot

  scoreboard:
    <<: *service-defaults
    # 8081 — gRPC: Kestrel обслуживает HTTP/2 без TLS только на отдельном
    # порту с явно заданным протоколом Http2 (см. AddMarsGrpcHosting).
    expose: ["8080", "8081"]
    build:
      context: .
      dockerfile: src/MARS.Scoreboard/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__ScoreboardDb: "Host=postgres;Database=mars_scoreboard;Username=mars_scoreboard;Password=${MARS_SCOREBOARD_PASSWORD}"

  cinema-queue:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.CinemaQueue/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__CinemaDb: "Host=postgres;Database=mars_cinema;Username=mars_cinema;Password=${MARS_CINEMA_PASSWORD}"

  media-storage:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.MediaStorage/Dockerfile
    environment:
      <<: *service-env
      ConnectionStrings__MediaStorageDb: "Host=postgres;Database=mars_mediastorage;Username=mars_mediastorage;Password=${MARS_MEDIASTORAGE_PASSWORD}"
      # Синхронизация wwwroot с внешним git-репозиторием. По умолчанию
      # выключена; токен приходит только из .env и не попадает в git config.
      MediaGit__Enabled: "${MEDIA_GIT_ENABLED:-false}"
      MediaGit__RepositoryUrl: "${MEDIA_GIT_REPOSITORY_URL:-}"
      MediaGit__Branch: "${MEDIA_GIT_BRANCH:-master}"
      MediaGit__Username: "${MEDIA_GIT_USERNAME:-}"
      MediaGit__Token: "${MEDIA_GIT_TOKEN:-}"
      MediaGit__GitDataDirectory: "/var/lib/mars-media-git"
      # Сводка о перекодировании мемов (AD13). Без токена перекодирование
      # работает, а отчёт пропускается с предупреждением в логе.
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__AdminIds__0: "${TELEGRAM_ADMIN_ID:-}"
      # Хранилище: лимит одного файла и срок жизни корзины.
      MediaStorage__MaxUploadSizeMb: "${MEDIA_STORAGE__MAXUPLOAD_SIZEMB:-95}"
      MediaStorage__TrashRetentionDays: "${MEDIA_STORAGE__TRASHRETENTIONDAYS:-30}"
    volumes:
      - mars-wwwroot:/app/wwwroot
      # Метаданные git держим вне рабочей копии: пустой volume поверх
      # /app/wwwroot/.git замаскировал бы каталог и сломал клонирование в
      # непустой wwwroot. Том переживает пересборку образа.
      - mars-media-git:/var/lib/mars-media-git

  admin:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/MARS.Admin/Dockerfile
    environment:
      <<: *service-env
      # MARS.Admin читает строку подключения AdminDb. В appsettings.json она
      # зашита на localhost, поэтому в контейнере без явного переопределения
      # admin-API падал с "Failed to connect to 127.0.0.1:5432".
      ConnectionStrings__AdminDb: "Host=postgres;Database=mars_admin;Username=mars_admin;Password=${MARS_ADMIN_PASSWORD}"

  # ─── Observability ──────────────────────────────────────────
  # Трейсы. Заменил jaegertracing/all-in-one: health-check datasource Jaeger
  # в Grafana 10.x отдавал 500 ([plugin.unavailable]), а Tempo — штатный
  # источник трейсов у Grafana. Монолитный режим (-target=all по умолчанию)
  # обходится без Kafka; локальный backend доступен только в нём.
  #
  # Блок 4317 на хосте публикуется, потому что Otlp__Endpoint указывает на
  # tempo:4317, а HTTP API 3200 нужен Grafana для запросов.
  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    # Без этого флага Tempo стартует и падает на «unknown backend ""»:
    # дефолтного пути конфига в образе нет.
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      # WAL и блоки. Без тома трейсы исчезали бы при рестарте.
      - tempo_data:/var/tempo
    networks:
      - mars-network

  prometheus:
    image: prom/prometheus:v2.48.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # TSDB: без тома история метрик обнулялась бы на каждом рестарте стека.
      - prometheus_data:/prometheus
    networks:
      - mars-network

  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    ports:
      # Не 3000: порт держит контейнер cryptpad из другого проекта, и
      # docker compose падал с «Bind for 0.0.0.0:3000 failed».
      - "30000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-mars}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - mars-network

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      # Без тома логи исчезали при каждом перезапуске стека.
      - loki_data:/loki
    networks:
      - mars-network

  # Доставка логов в Loki. Единственный UI для всего наблюдаемого — Grafana:
  # метрики (Prometheus), логи (Loki) и трейсы (Tempo) в одном интерфейсе.
  #
  # Alloy читает stdout контейнеров через Docker-демон, поэтому конфигурация
  # живёт отдельно от приложений: ни один сервис не знает про Loki, и добавление
  # нового сервиса не требует правок здесь. Без маунта docker.sock Alloy
  # ничего не увидит, а без фильтра по compose-проекту забрал бы логи всей машины.
  alloy:
    # Тег с префиксом v: Docker Hub публикует grafana/alloy:v1.20.1, а без v
    # образ не находится. Пин, чтобы Allоy не поехал на новую majorsку сам.
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Позиции чтения: без них рестарт Alloy заставил бы Loki читать логи заново.
      - alloy_data:/var/lib/alloy/data
    ports:
      # UI Alloy для отладки пайплайна, когда логи не доходят.
      - "12345:12345"
    networks:
      - mars-network

# ─── Networks ──────────────────────────────────────────────
networks:
  mars-network:
    driver: bridge
    name: mars-network

# ─── Volumes ───────────────────────────────────────────────
volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:
  mars-wwwroot:
  mars-media-git:
  loki_data:
  alloy_data:
  prometheus_data:
  tempo_data:
