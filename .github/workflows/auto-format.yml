name: Auto Format

# Форматирование CSharpier, которое ложится в последний коммит, а не добавляет свой.
#
# Раньше неотформатированный файл был виден только тому, кто открыл редактор:
# локально `dotnet csharpier --check .` на этой машине давал 217 файлов из 707.
# Теперь расхождение устраняется в том же прогоне, который его обнаружил.
#
# Почему amend, а не отдельный коммит. Отдельный коммит `style: автоформатирование
# CSharpier` — это запись в истории, которой не писал никто из людей: у человека,
# запушившего свою работу, из-под ног уезжает последний коммит, а поверх его
# появляется чужой. При amend остаётся один коммит с двумя авторами: автор —
# прежний, коммитер — бот, плюс строка `Co-authored-by`. История не растёт.
#
# Область действия намеренно узкая: main и PR в main. На feature-ветках
# форматирование не наезжает на незавершённую работу, а на форках токен
# принудительно read-only и запушить нельзя ничего.
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  # По умолчанию workflow безопасен для PR: только чтение.
  # Write-доступ выдаётся исключительно job для доверенного push/workflow_dispatch.
  contents: read

# Последовательно, а не параллельно: два прогона на одной ветке конфликтуют при
# force-push, и второй из них всё равно завершился бы предупреждением.
concurrency:
  group: auto-format-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

  # PR проверяется без записи в head-ветку. Это важно по двум причинам:
  # - GITHUB_TOKEN не должен создавать bot push -> pull_request event -> повторный CI;
  # - код PR нельзя выполнять с write-токеном или PAT.
  # Основной CI запускается своим pull_request trigger параллельно и не зависит от этого job.
  format-pr:
    name: format
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      START_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout PR head (read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.START_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Восстановить локальные инструменты
        run: dotnet tool restore

      - name: Разделить файлы с несколькими классами
        run: |
          dotnet run \
            --project .github/tools/SingleClassPerFile/SingleClassPerFile.csproj \
            --configuration Release -- --all --fix

      - name: Отформатировать
        run: dotnet csharpier format .

      - name: Проверить результат форматирования
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Файлы уже соответствуют правилам." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Есть файлы, которые автоформатирование изменило бы. PR не переписывается автоматически."
            {
              echo "### Автоформатирование"
              echo ""
              echo "Найдены изменения форматирования. Этот job работает read-only и не меняет PR-ветку."
              echo ""
              echo '```'
              git status --short
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  format-main:
  format-main:
    name: format
    if: github.event_name != 'pull_request'
    continue-on-error: true
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest

    env:
      # Коммитер, а не автор. Автора amend не меняет — см. шаг amend.
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      # SHA коммита push/workflow_dispatch, который предстоит переписать.
      # Это же значение — ожидаемая голова ветки для --force-with-lease.
      START_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      # Есть ли PAT. Необязателен: с ним push запускает проверки сам, без него
      # перезапуск делается вручную последним шагом. Пустое значение секрета, не
      # объявленного в репозитории, — норма, а не ошибка workflow.
      HAS_PAT: ${{ secrets.AUTO_FORMAT_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Этот job запускается только на push/workflow_dispatch в основном репозитории.
          repository: ${{ github.repository }}
          ref: ${{ env.START_SHA }}
          # PAT, если он задан, иначе GITHUB_TOKEN. Через checkout, а не через
          # remote set-url: проверка и amend должны идти тем же токеном, каким
          # пойдёт push, иначе форматирование окажется в чужом форке.
          token: ${{ secrets.AUTO_FORMAT_TOKEN || github.token }}
          # Нужна вся история: amend переписывает последний коммит, а запушить
          # его от orphaned-состояния нельзя.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Восстановить локальные инструменты
        run: dotnet tool restore

      - name: Разделить файлы с несколькими классами
        run: |
          dotnet run \
            --project .github/tools/SingleClassPerFile/SingleClassPerFile.csproj \
            --configuration Release -- --all --fix

      - name: Отформатировать
        run: dotnet csharpier format .

      - name: Проверить, изменилось ли что-нибудь
        id: check
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Файлы уже соответствуют правилам — история не трогается." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Автоматические исправления"
              echo ""
              echo "Разделение классов и CSharpier будут включены в последний коммит ветки."
              echo ""
              echo '```'
              git status --short
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Определить целевую ветку
        id: target
        run: |
          echo "ref=refs/heads/${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "pushable=true" >> "$GITHUB_OUTPUT"

      - name: Положить форматирование в последний коммит
        id: amend
        if: steps.check.outputs.changed == 'true' && steps.target.outputs.pushable == 'true'
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

          # Автор переносится явно, хотя amend сохраняет его и сам: полагаться на
          # дефолт здесь нельзя, молчаливая смена автора отняла бы у человека его
          # собственный коммит и выглядела бы как чужая работа в его истории.
          author="$(git log -1 --pretty='%an <%ae>')"

          # Файл сообщения живёт в .git, а не в RUNNER_TEMP: на раннере
          # RUNNER_TEMP и так вне рабочей копии, но `git add --all` ниже не должен
          # зависеть от того, где именно оказался временный файл — иначе файл
          # сообщения молча уехал бы в коммит при первом же сдвиге пути.
          git_dir="$(git rev-parse --absolute-git-dir)"

          # Сообщение исходного коммита сохраняется целиком, в trailer добавляется
          # только соавторство бота. Зачем: amend меняет хеш коммита, и без этой
          # строки человек увидит в своей ветке «свой» коммит с чужим хешем и без
          # следа о том, что он переписан.
          git log -1 --pretty=%B > "$git_dir/commit-message.txt"
          {
            printf '\n'
            printf 'Co-authored-by: %s <%s>\n' "$BOT_NAME" "$BOT_EMAIL"
          } >> "$git_dir/commit-message.txt"

          git add --all
          git commit --amend \
            -F "$git_dir/commit-message.txt" \
            --author "$author"

          # Контракт «два автора при одном коммите» проверяется, а не предполагается.
          if [ "$(git log -1 --pretty='%an <%ae>')" != "$author" ]; then
            echo "::error::Автор исходного коммита не пережил amend."
            exit 1
          fi

          echo "amended=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "Коммит переписан, хеш стал \`${{ steps.amend.outputs.amended }}\`,"
            echo "автор прежний, коммитер и соавтор — бот. Отдельного коммита нет."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Запушить переписанный коммит
        id: push
        if: steps.amend.outputs.amended != ''
        run: |
          ref="${{ steps.target.outputs.ref }}"
          branch="${ref#refs/heads/}"

          # Lease привязан к START_SHA, то есть к коммиту, который этот прогон
          # выкачал и переписал. Это единственное честное значение: remote-tracking
          # ref не годится, он обновляется на push (в том числе чужой), и lease
          # против него проходит всегда — то есть перезапись сносила бы чужой
          # коммит молча, а человек узнал бы об этом уже в чужой ветке.
          #
          # Ошибка не теоретическая: на живом git в отдельном репозитории
          # ожидаемое значение из FETCH_HEAD после fetch совпадало всегда, и
          # force-push проходил, хотя ветку только что увеличили чужим коммитом.
          if git push --force-with-lease="$ref:$START_SHA" origin "HEAD:$ref"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Переписанный коммит запушен в \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ветка уехала вперёд, форматирование не запушено. Следующий прогон повторит."
            echo "Ветка уехала вперёд: форматирование не запушено, следующий прогон повторит." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Перезапустить проверки на переписанном коммите
        if: steps.push.outputs.pushed == 'true' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ steps.target.outputs.ref }}"
          branch="${ref#refs/heads/}"

          # Push, сделанный GITHUB_TOKEN, не запускает workflow — это защита GitHub
          # от рекурсии, и обойти её нельзя. Значит после amend коммит с новым хешем
          # остался бы без единой проверки, а обязательные статусы в branch protection
          # не закрылись бы никогда: следующий push был бы заблокирован.
          #
          # С PAT из секрета запускать не нужно: push PAT'ом запускает проверки сам,
          # и этот шаг лишь прогнал бы тот же код второй раз.
          #
          # -R обязателен: checkout для PR настроен на head-репозиторий, и без -R
          # gh workflow run пошёл бы искать ci.yml там.
          gh workflow run ci.yml --ref "$branch" -R "${{ github.repository }}"
          echo "Проверки перезапущены на переписанном коммите \`$branch\`." >> "$GITHUB_STEP_SUMMARY"