name: Auto Format

# Форматирование CSharpier, которое ложится в последний коммит, а не добавляет свой.
#
# Раньше неотформатированный файл был виден только тому, кто открыл редактор:
# локально `dotnet csharpier --check .` на этой машине давал 217 файлов из 707.
# Теперь расхождение устраняется в том же прогоне, который его обнаружил.
#
# На PR: read-only проверка без переписывания ветки (job format-pr).
#
# На main: защита ветки запрещает force-push и прямые коммиты, поэтому amend
# последнего коммита невозможен. Вместо этого job format-main, если после
# разделения типов и CSharpier есть изменения, пушит ветку chore/auto-format
# и открывает/обновляет отдельный PR в main (через PAT, чтобы required checks
# реально запустились). История main растёт на один коммит бота в этом PR.
#
# PR получает read-only проверку без переписывания ветки. Изменения вносятся
# только в доверенном workflow на main после обычного push или dispatch.
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  # По умолчанию workflow безопасен для PR: только чтение.
  # Write-доступ выдаётся исключительно job для доверенного push/workflow_dispatch.
  contents: read

# Последовательно, а не параллельно: два прогона на одной ветке конфликтуют при
# force-push, и второй из них всё равно завершился бы предупреждением.
concurrency:
  group: auto-format-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # PR проверяется без записи в head-ветку. Это важно по двум причинам:
  # - GITHUB_TOKEN не должен создавать bot push -> pull_request event -> повторный CI;
  # - код PR нельзя выполнять с write-токеном или PAT.
  # Основной CI запускается своим pull_request trigger параллельно и не зависит от этого job.
  format-pr:
    name: format
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      START_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout PR head (read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.START_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Восстановить локальные инструменты
        run: dotnet tool restore

      - name: Разделить файлы с несколькими типами
        run: |
          dotnet run \
            --project .github/tools/SingleClassPerFile/SingleClassPerFile.csproj \
            --configuration Release -- --all --fix

      - name: Выровнять namespace
        run: |
          dotnet run \
            --project .github/tools/NamespaceConformance/NamespaceConformance.csproj \
            --configuration Release -- --all --fix

      - name: Отформатировать
        run: dotnet csharpier format .

      - name: Проверить результат форматирования
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Файлы уже соответствуют правилам." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Есть файлы, которые автоформатирование изменило бы. PR не переписывается автоматически."
            {
              echo "### Автоформатирование"
              echo ""
              echo "Найдены изменения форматирования. Этот job работает read-only и не меняет PR-ветку."
              echo ""
              echo '```'
              git status --short
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  format-main:
    name: format
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest

    env:
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      # SHA коммита push/workflow_dispatch, для которого строится авто-PR.
      START_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Этот job запускается только на push/workflow_dispatch в основном репозитории.
          repository: ${{ github.repository }}
          ref: ${{ env.START_SHA }}
          # PAT, если он задан, иначе GITHUB_TOKEN. Через checkout, а не через
          # remote set-url: проверка и amend должны идти тем же токеном, каким
          # пойдёт push, иначе форматирование окажется в чужом форке.
          token: ${{ secrets.AUTO_FORMAT_TOKEN || github.token }}
          # Нужна вся история: amend переписывает последний коммит, а запушить
          # его от orphaned-состояния нельзя.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Восстановить локальные инструменты
        run: dotnet tool restore

      - name: Разделить файлы с несколькими типами
        run: |
          dotnet run \
            --project .github/tools/SingleClassPerFile/SingleClassPerFile.csproj \
            --configuration Release -- --all --fix

      - name: Отформатировать
        run: dotnet csharpier format .

      - name: Проверить, изменилось ли что-нибудь
        id: check
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Файлы уже соответствуют правилам — история не трогается." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Автоматические исправления"
              echo ""
              echo "Разделение типов и CSharpier будут включены в последний коммит ветки."
              echo ""
              echo '```'
              git status --short
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Открыть PR с автоматическими исправлениями
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_FORMAT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

          BRANCH="chore/auto-format"
          git checkout -B "$BRANCH"
          # Всегда подтягиваем удалённую ветку перед форматированием: так не
          # теряются уже отправленные изменения и ветка остаётся синхронной.
          git pull origin "$BRANCH" || true
          git add --all
          git commit -m "chore: автоформатирование, разделение типов и выравнивание namespace (auto-format)" \
            -m "Автоматически сгенерировано workflow auto-format для коммита $START_SHA."

          # Без PAT gh создаёт PR от GITHUB_TOKEN, и такой PR не запускает required
          # checks (защита GitHub от рекурсии). В этом случае автоматика бесполезна:
          # лучше упасть громко и дать человеку сделать фикс локально.
          if [ -z "${{ secrets.AUTO_FORMAT_TOKEN }}" ]; then
            echo "::error::AUTO_FORMAT_TOKEN не задан: PR, созданный GITHUB_TOKEN, не получит " \
              "required checks. Настройте секрет или запустите фикс локально " \
              "(.github/tools/SingleClassPerFile --all --fix + .github/tools/NamespaceConformance --all --fix + dotnet csharpier format .)."
            git push --force origin "HEAD:refs/heads/$BRANCH" || true
            exit 1
          fi

          git push --force origin "HEAD:refs/heads/$BRANCH"

          # PR должен быть открыт, если есть изменения. Закрытый/слитый PR для
          # этой ветки не считается открытым, поэтому создаём новый.
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            echo "PR для ветки $BRANCH уже открыт — обновлён пушем."
          elif [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null)" ]; then
            echo "PR для ветки $BRANCH уже открыт — обновлён пушем."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: автоформатирование, разделение типов и выравнивание namespace (auto-format)" \
              --body "Автоматический PR от workflow auto-format для коммита $START_SHA. Содержит результат SingleClassPerFile --all --fix, NamespaceConformance --all --fix и dotnet csharpier format . Сгенерировано автоматически; проверьте diff и замержьте, когда required checks зелёные."
          fi
          echo "PR с автоматическими исправлениями открыт/обновлён." >> "$GITHUB_STEP_SUMMARY"