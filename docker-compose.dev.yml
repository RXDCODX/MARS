      - dev-twitch-core-MARS.Platform.Infrastructure.Http-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Http/obj
      - dev-twitch-core-MARS.Platform.Infrastructure.Http-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Http/bin
      - /src/src/MARS.Twitch/MARS.Twitch.Host/Properties
