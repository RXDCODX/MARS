# Development overrides. Подключается явно:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Раньше файл назывался docker-compose.override.yml и подхватывался автоматически, из-за
# чего обычный `docker compose up` собирал dev-образы с `dotnet watch` и зависашим mount'ом
# хоста. Базовый docker-compose.yml теперь поднимает стек из production-образов.
#
# Раньше оверрайд монтировал исходники в /app/src и запускал `dotnet watch` в финальном
# stage, который собран на mcr.microsoft.com/dotnet/aspnet:10.0. В нём нет SDK, нет
# `dotnet watch` и нет файла проекта по WORKDIR — контейнер молча падал с
# "Couldn't find a project to run", а hot reload не работал.
#
# Теперь используется отдельный stage `dev` (SDK-образ + curl для healthcheck),
# а весь репозиторий монтируется в /src, поэтому ProjectReference на MARS.Shared
# и restore видят те же относительные пути, что и на хосте.
#
# Две правки, без которых стенд не поднимается вовсе:
#
# * Команда начинается с `dotnet` явно. Stage `dev` объявлен как `FROM … AS dev`,
#   а не поверх `final`, поэтому ENTRYPOINT ["dotnet", "MARS.X.dll"] из
#   финального stage в него не попадает: у образа нет ни ENTRYPOINT, ни CMD, и
#   compose выполняет command как есть. Без `dotnet` первый же
#   `command: ["watch", …]` запускал /usr/bin/watch из procps — он стоит в PATH
#   раньше dotnet, — и контейнер уходил в рестарт с
#   `watch: unrecognized option '--project'`.
#
# * У каждого сервиса свои obj и bin, свои и у MARS.Shared. MSBuild пишет вывод
#   проекта рядом с исходниками, а репозиторий смонтирован во все контейнеры:
#   шестнадцать `dotnet watch` собирали общий MARS.Shared в одни и те же файлы и
#   падали с "The process cannot access the file … because it is being used by
#   another process". Тома заодно закрывают вторую половину: собранные на Windows
#   хостовые obj больше не видны контейнерам, а вместе с ними и project.assets.json
#   с fallback-папкой `C:\Program Files (x86)\…\NuGetPackages`, которой в
#   контейнере нет. Поэтому volumes перечислены у каждого сервиса, а не в якоре.

x-dev-defaults: &dev-defaults
  build:
    context: .
    target: dev
  restart: unless-stopped
  working_dir: /src
  command: ["dotnet", "run", "--project", "{PROJECT}", "--urls", "http://+:8080"]

services:
  gateway:
    <<: *dev-defaults
    volumes:
      - ./:/src
      - nuget-packages:/root/.nuget/packages
      - dev-gateway-obj:/src/src/MARS.Gateway/obj
      - dev-gateway-bin:/src/src/MARS.Gateway/bin
      - dev-gateway-shared-obj:/src/src/MARS.Shared/obj
      - dev-gateway-shared-bin:/src/src/MARS.Shared/bin
    build:
      context: .
      dockerfile: src/MARS.Gateway/Dockerfile
      target: dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # launchSettings.json подставляет applicationUrl 65130/65131, и Kestrel
      # поднимается на них вместо 8080: healthcheck compose стучался в закрытый
      # порт, и контейнер был unhealthy при полностью рабочем приложении.
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "10155:8080"
    # Gateway — единственный сервис без hot reload, и на это ушла целая ветка
# расследования, поэтому причина описана целиком.
#
# Проверено на живых контейнерах, четыре симптома:
#   1. `dotnet run` зависал на MSBuild-оценке без единой строки вывода. Причина —
#      Web SDK включает содержимое проекта в glob и обходит ClientApp вместе с
#      node_modules: 115 тысяч файлов по bind-mount'у хоста. Вылечено
#      DefaultItemExcludes в MARS.Gateway.csproj.
#   2. `dotnet watch` доходил до "Loaded 2 project(s)", дальше не launches: только
#      этот проект доходит до чтения staticwebassets.development.json по пути
#      "obj\Debug/…" — с обратным слэшем, собранным из MSBuild-свойства
#      BaseIntermediateOutputPath. Такого файла не бывает (манифест пишется
#      прямым слэшем — расхождение внутри SDK), чтение падает, и приложение не
#      стартует. Остальные пятнадцать сервисов с той же формой проекта к этому
#      шагу не доходят.
#   3. `dotnet watch --no-hot-reload` обходит этот шаг и приложение поднимается —
#      на короткий прогон, а в compose-запуске всё так же зависал на старте.
#   4. Запуск готовой сборки (`dotnet MARS.Gateway.dll`) работает безотказно, но
#      только из своего каталога: контейнер стартует с working_dir /src, и без cd
#      content root остаётся /src — appsettings.json не читается, YARP получает
#      пустую конфигурацию, и на /, /storage-ui/ и любом /api/** приходит 404
#      вместо проксирования. cd в каталог сборки обязателен, а не украшение.
#
# Поэтому здесь build + запуск собранного приложения: стенд поднимается всегда,
# а пересборка происходит при перезапуске контейнера. Горячая перезагрузка в
# Gateway не работает — в нём почти нет рантайм-кода, клиент собирается
# отдельно (контейнер client-ui).
    command: ["sh", "-c", "dotnet build src/MARS.Gateway/MARS.Gateway.csproj -v:q --nologo && cd src/MARS.Gateway/bin/Debug/net10.0-windows && exec dotnet MARS.Gateway.dll --urls http://+:8080"]

  twitch-core:
    <<: *dev-defaults
    volumes:
      - ./:/src
      - nuget-packages:/root/.nuget/packages
      - dev-twitch-core-obj:/src/src/MARS.TwitchCore/obj
      - dev-twitch-core-bin:/src/src/MARS.TwitchCore/bin
      - dev-twitch-core-shared-obj:/src/src/MARS.Shared/obj
      - dev-twitch-core-shared-bin:/src/src/MARS.Shared/bin
    build:
      context: .
      dockerfile: src/MARS.TwitchCore/Dockerfile
      target: dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    ports:
      - "5001:8080"
    command: ["dotnet", "watch", "--project", "src/MARS.TwitchCore/MARS.TwitchCore.csproj", "--urls", "http://+:8080"]

