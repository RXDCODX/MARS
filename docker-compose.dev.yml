      - dev-twitch-core-MARS.Platform.Clients.Http.Infrastructure-obj:/src/src/MARS.Platform.Clients.Http.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Clients.Http.Infrastructure-bin:/src/src/MARS.Platform.Clients.Http.Infrastructure/bin
      - /src/src/MARS.TwitchCore/Properties
    build:
      context: .
      dockerfile: src/MARS.TwitchCore/Dockerfile
      target: dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    ports:
      - "${MARS_PORT_TWITCH_CORE}:8080"
    command: ["dotnet", "watch", "--project", "src/MARS.TwitchCore/MARS.TwitchCore.csproj", "--urls", "http://+:8080"]

