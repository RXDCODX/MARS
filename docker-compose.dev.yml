      - dev-twitch-core-MARS.Shared.Kernel-bin:/src/src/MARS.Shared.Kernel/bin
      - dev-twitch-core-MARS.Shared.Contracts-obj:/src/src/MARS.Shared.Contracts/obj
      - dev-twitch-core-MARS.Shared.Contracts-bin:/src/src/MARS.Shared.Contracts/bin
      - dev-twitch-core-MARS.Platform.Messaging.RabbitMq.Infrastructure-obj:/src/src/MARS.Platform.Messaging.RabbitMq.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Messaging.RabbitMq.Infrastructure-bin:/src/src/MARS.Platform.Messaging.RabbitMq.Infrastructure/bin
      - dev-twitch-core-MARS.Platform.Persistence.Postgres.Infrastructure-obj:/src/src/MARS.Platform.Persistence.Postgres.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Persistence.Postgres.Infrastructure-bin:/src/src/MARS.Platform.Persistence.Postgres.Infrastructure/bin
      - dev-twitch-core-MARS.Platform.Grpc.Infrastructure-obj:/src/src/MARS.Platform.Grpc.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Grpc.Infrastructure-bin:/src/src/MARS.Platform.Grpc.Infrastructure/bin
      - dev-twitch-core-MARS.Platform.Observability.Logging.Infrastructure-obj:/src/src/MARS.Platform.Observability.Logging.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Observability.Logging.Infrastructure-bin:/src/src/MARS.Platform.Observability.Logging.Infrastructure/bin
      - dev-twitch-core-MARS.Platform.Observability.Telemetry.Infrastructure-obj:/src/src/MARS.Platform.Observability.Telemetry.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Observability.Telemetry.Infrastructure-bin:/src/src/MARS.Platform.Observability.Telemetry.Infrastructure/bin
      - dev-twitch-core-MARS.Platform.Web.AspNetCore.Infrastructure-obj:/src/src/MARS.Platform.Web.AspNetCore.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Web.AspNetCore.Infrastructure-bin:/src/src/MARS.Platform.Web.AspNetCore.Infrastructure/bin
      - dev-twitch-core-MARS.Platform.Development.Infrastructure-obj:/src/src/MARS.Platform.Development.Infrastructure/obj
      - dev-twitch-core-MARS.Platform.Development.Infrastructure-bin:/src/src/MARS.Platform.Development.Infrastructure/bin
      - dev-twitch-core-MARS.Platform.Hosting.Infrastructure-obj:/src/src/MARS.Platform.Hosting.Infrastructure/obj
