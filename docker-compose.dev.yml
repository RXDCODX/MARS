      - dev-twitch-core-MARS.Platform.Infrastructure.Postgres-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Postgres/obj
      - dev-twitch-core-MARS.Platform.Infrastructure.Postgres-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Postgres/bin
      - dev-twitch-core-MARS.Platform.Infrastructure.Observability.Logging-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Logging/obj
      - dev-twitch-core-MARS.Platform.Infrastructure.Observability.Logging-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Logging/bin
      - dev-twitch-core-MARS.Platform.Infrastructure.Observability.Telemetry-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Telemetry/obj
      - dev-twitch-core-MARS.Platform.Infrastructure.Observability.Telemetry-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Telemetry/bin
      - dev-twitch-core-MARS.Platform.Infrastructure.Web.AspNetCore-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Web.AspNetCore/obj
      - dev-twitch-core-MARS.Platform.Infrastructure.Web.AspNetCore-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Web.AspNetCore/bin
      - dev-twitch-core-MARS.Platform.Infrastructure.Development-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Development/obj
