# Development overrides. Подключается явно:
#   docker compose --env-file .env.development -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
#
# ... (весь блок комментариев из предыдущей версии сохранён без изменений) ...
#
# Исключение Properties/launchSettings.json:
#   dotnet watch внутри контейнера вызывает dotnet run, а тот читает
#   Properties/launchSettings.json из bind-mount'а хоста. Если там заданы
#   environmentVariables (например, ConnectionStrings__TwitchDb=Host=localhost
#   или applicationUrl с другим портом), они применяются поверх переменных,
#   пришедших из Docker, и приложение игнорирует docker-compose.environment.
#   Чтобы этого не было, папка Properties перекрывается анонимным томом:
#     - /src/src/<Project>/Properties
#   Docker не пробрасывает туда содержимое из ./:/src, и папка внутри
#   контейнера остаётся пустой. На хосте launchSettings.json продолжает
#   работать для локального запуска.

name: mars-dev

x-dev-defaults: &dev-defaults
  build:
    context: .
    target: dev
  restart: unless-stopped
  working_dir: /src
  command: ["dotnet", "run", "--project", "{PROJECT}", "--urls", "http://+:8080"]

services:
  gateway:
    <<: *dev-defaults
    volumes:
      - ./:/src
      - nuget-packages:/root/.nuget/packages
      - dev-gateway-obj:/src/src/MARS.Gateway/obj
      - dev-gateway-bin:/src/src/MARS.Gateway/bin
      - dev-gateway-MARS.Shared.Kernel-obj:/src/src/MARS.Shared/MARS.Shared.Kernel/obj
      - dev-gateway-MARS.Shared.Kernel-bin:/src/src/MARS.Shared/MARS.Shared.Kernel/bin
      - dev-gateway-MARS.Shared.Contracts-obj:/src/src/MARS.Shared/MARS.Shared.Contracts/obj
      - dev-gateway-MARS.Shared.Contracts-bin:/src/src/MARS.Shared/MARS.Shared.Contracts/bin
      - dev-gateway-MARS.WaifuGacha.Domain-obj:/src/src/MARS.WaifuGacha/MARS.WaifuGacha.Domain/obj
      - dev-gateway-MARS.WaifuGacha.Domain-bin:/src/src/MARS.WaifuGacha/MARS.WaifuGacha.Domain/bin
      - dev-gateway-MARS.Platform.Infrastructure.RabbitMq-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.RabbitMq/obj
      - dev-gateway-MARS.Platform.Infrastructure.RabbitMq-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.RabbitMq/bin
      - dev-gateway-MARS.Platform.Infrastructure.Postgres-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Postgres/obj
      - dev-gateway-MARS.Platform.Infrastructure.Postgres-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Postgres/bin
      - dev-gateway-MARS.Platform.Infrastructure.Observability.Logging-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Logging/obj
      - dev-gateway-MARS.Platform.Infrastructure.Observability.Logging-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Logging/bin
      - dev-gateway-MARS.Platform.Infrastructure.Observability.Telemetry-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Telemetry/obj
      - dev-gateway-MARS.Platform.Infrastructure.Observability.Telemetry-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Observability.Telemetry/bin
      - dev-gateway-MARS.Platform.Infrastructure.Web.AspNetCore-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Web.AspNetCore/obj
      - dev-gateway-MARS.Platform.Infrastructure.Web.AspNetCore-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Web.AspNetCore/bin
      - dev-gateway-MARS.Platform.Infrastructure.Development-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Development/obj
      - dev-gateway-MARS.Platform.Infrastructure.Development-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Development/bin
      - dev-gateway-MARS.Platform.Infrastructure.Hosting-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Hosting/obj
      - dev-gateway-MARS.Platform.Infrastructure.Hosting-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Hosting/bin
      - dev-gateway-MARS.Platform.Infrastructure.Http-obj:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Http/obj
      - dev-gateway-MARS.Platform.Infrastructure.Http-bin:/src/src/MARS.Platform/MARS.Platform.Infrastructure.Http/bin
      # Properties не исключаем: gateway не использует dotnet run/watch,
      # launchSettings.json не читается.
    build:
      context: .
      dockerfile: src/MARS.Gateway/Dockerfile
      target: dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_ROLL_FORWARD: latestMajor
    command: ["sh", "-c", "dotnet build src/MARS.Gateway/MARS.Gateway.csproj -v:q --nologo && cd src/MARS.Gateway/bin/Debug/net10.0-windows && exec dotnet MARS.Gateway.dll --urls http://+:8080"]

  # В dev nginx заменяется Vite. Страница и HMR WebSocket проходят через
  # тот же Gateway origin, а VITE_HMR_CLIENT_PORT указывает опубликованный порт
  # шлюза, чтобы браузер подключался к WebSocket через YARP.
  client-ui:
    build:
      context: .
      dockerfile: src/MARS.ClientUi/Dockerfile
      target: dev
    working_dir: /ui/ClientApp
    volumes:
      - ./src/MARS.ClientUi:/ui/ClientApp
      - dev-client-ui-node-modules:/ui/ClientApp/node_modules
    environment:
      NODE_ENV: development
      VITE_HMR_CLIENT_PORT: "${MARS_PORT_GATEWAY}"
    command: ["sh", "-c", "corepack yarn install --immutable && exec corepack yarn dev --host 0.0.0.0 --port 80 --strictPort"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

