# Раздача клиента MARS.Gateway: оверлеи, админка и сайт.
#
# Наружу контейнер не публикуется: единственный опубликованный порт — Gateway
# (9155), и он проксирует корень сюда. Причина — один origin для страницы, API и
# SignalR-хаба: иначе браузер получил бы CORS и потерял бы авторизацию.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Оверлей открывают как file:// или через OBS, и картинка с обложкой нужна
    # раньше, чем загрузится сценарий. Без этого заголовка первый кадр белый.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Точка для compose-healthcheck. Отдельный location, а не проверка корня:
    # иначе healthcheck зависел бы от существования index.html, то есть от
    # успешности сборки клиента, а не от готовности отдавать статику.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Ассеты Vite кладутся в assets/ и получают хеш в имени, поэтому содержимое
    # файла никогда не меняется по тому же URL. immutable позволяет браузеру не
    # обращаться к ним повторно до истечения года.
    #
    # Директива expires здесь не нужна: она добавила бы второе значение
    # Cache-Control к заголовку из add_header, и браузер получил бы
    # «max-age=31536000, public, max-age=31536000, immutable».
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Сборка уже кладёт рядом с каждым файлом .gz (viteCompression с порогом
    # 1 КБ). gzip_static отдаёт их как есть, иначе nginx сжимал бы их повторно
    # на каждый запрос, а сами файлы ехали бы в образ мёртвым грузом.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # index.html нельзя кэшировать: он перечисляет хешированные чанки, и
    # закэшированная копия после релиза ссылалась бы на файлы, которых больше
    # нет. Остальное закэшировано выше на год.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 68 маршрутов живут на react-router, а не на диске. Без фолбэка на
    # index.html прямой заход на /waifu-roll или /logs отдал бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}