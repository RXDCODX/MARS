apiVersion: 1

providers:
  - name: MARS
    orgId: 1
    folder: MARS
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      # foldersFromFilesStructure НЕ включаем: флаг перебивает поле folder
      # выше, и дашборд из корня каталога провижинился в General, а не в MARS.
      # Включать его стоит, только если появится вложенность
      # mars-overview/panel-*.json.
