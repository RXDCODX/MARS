apiVersion: 1

# Метрики. prometheus-net отдаёт их на /metrics каждого из 14 сервисов,
# prometheus scrape_interval 15s.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s