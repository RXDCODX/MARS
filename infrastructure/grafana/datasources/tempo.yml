apiVersion: 1

# Сервисы отправляют трейсы по OTLP на Tempo (tempo:4317). Tempo генерирует
# span-metrics/service-graphs и отправляет их в Prometheus Remote Write.
#
# trace → logs сопоставляет resource service.name с Loki label service_name.
# TraceId не индексируется как Loki label: он высококардинальный, поэтому
# фильтрация по нему остаётся выключенной.
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2s
        spanEndTimeShift: 2s
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: false
        filterBySpanID: false
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
