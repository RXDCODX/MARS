apiVersion: 1

# Логи приложений. Наполняет Alloy из infrastructure/alloy/config.alloy:
# он принимает OTLP-логи приложений (порт 4317) и читает stdout контейнеров
# инфраструктуры, у которых метки mars.logs=otlp нет, — и то и другое уходит в
# Loki push-API. До появления Alloy Loki был пустым: promtail не было, а
# «Loki:Url» не читался ни одним обработчиком в коде.
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000