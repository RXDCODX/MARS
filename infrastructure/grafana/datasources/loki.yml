apiVersion: 1

# Логи приложений. Наполняет Alloy из infrastructure/alloy/config.alloy:
# он читает stdout контейнеров и пушит их в Loki push-API.
# До появления Alloy Loki был пустым: promtail не было, а «Loki:Url» не
# читался ни одним обработчиком в коде.
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000