global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mars-services'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'gateway:8080'
          - 'twitch-core:8080'
          - 'waifu-gacha:8080'
          - 'telegram:8080'
          - 'discord:8080'
          - 'commands:8080'
          - 'sound-request:8080'
          - 'tts:8080'
          - 'obs:8080'
          - 'alerts:8080'
          - 'scoreboard:8080'
          - 'cinema-queue:8080'
          - 'media-storage:8080'
          - 'admin:8080'
          - 'shikimori:8080'
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):(\d+)'
        target_label: instance
        replacement: '${1}'

  # matoi собирается отдельной задачей намеренно: он отдаёт через стандартные
  # Go-коллекторы гистограмму http_request_duration_seconds — то же имя, что у
  # prometheus-net, — и ещё process_start_time_seconds, по которой собрана
  # переменная $instance в mars-overview.json. В общем job отличить их нечем,
  # кроме instance, и matoi попал бы в список .NET-сервисов дашборда, смешав
  # бейкеты Go-сервиса с бейкетами выбранного .NET-инстанса в панелях p50/p95/p99.
  - job_name: 'matoi'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'matoi:3000'
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):(\d+)'
        target_label: instance
        replacement: '${1}'

  # Хостовый запуск (F5 из IDE): отлаживаемый процесс не является контейнером,
  # поэтому его /metrics не попадает ни в одну задачу выше. Сервис сам записывает
  # свой порт в data/prometheus-local/<служба>.json, а каталог монтируется в
  # контейнер только dev-оверрайдом.
  #
  # relabel_configs у задачи нет намеренно: instance приходит из файла вместе с
  # именем службы, и перезапись по адресу подписала бы цель host.docker.internal,
  # из-за чего переменная $instance дашборда показала бы адрес вместо сервиса.
  #
  # Задача идёт последней: файл целей сервис дописывает на ходу, и вставка
  # задачи в середину скрыла бы меняющийся каталог под чужим блоком.
  - job_name: 'mars-local'
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - '/etc/prometheus/local/*.json'
        refresh_interval: 15s
