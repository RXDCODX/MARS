# ─────────────────────────────────────────────────────────────────────────────
# Данные профиля запуска MARS.Local — источник для scripts/windows/local.ps1 и
# scripts/unix/local.sh.
#
# Профиль описывает сервис, запущенный НА ХОСТЕ (F5 из IDE), при инфраструктуре
# в Docker: postgres, rabbitmq, tempo и matoi поднимает стенд разработки
# (scripts/*/stack -Dev), а отлаживаемый сервис слушает хостовый порт из схемы.
# Файл один на обе платформы намеренно: два списка переменных разошлись бы
# молча, а расхождение тут проявляется не сборкой, а «сервис не поднялся».
#
# ─── Формат ──────────────────────────────────────────────────────────────────
#   [common]        — ключи, попадающие в профиль КАЖДОГО сервиса;
#   [MARS.TwitchCore] — ключи одного сервиса (перекрывают common);
#   ключ=значение   — имена переменных окружения ASP.NET Core: разделитель
#                     уровней конфигурации — двойное подчёркивание
#                     (RabbitMq__Host → RabbitMq:Host);
#   ${ИМЯ}          — подстановка из ШАБЛОНА окружения
#                     (.env.development.example), а не из файла с секретами:
#                     иначе настоящий токен уехал бы в коммит;
#   #secrets ...    — ключи, которых в профиле быть НЕ должно. Их значения
#                     секретны или задаются владельцем, и профиль их не
#                     содержит — скрипт печатает их напоминанием, а значение
#                     кладётся в user-secrets (см. README рядом);
#   port=…          — хостовый порт сервиса, из него собирается applicationUrl
#                     (`--urls` профиль не задаёт: gRPC-сервисы слушают порты
#                     из Grpc__HttpPort/Grpc__GrpcPort и подавили бы его).
#
# appsettings.json при этом не меняется: переменные окружения перебивают его
# (порядок источников конфигурации), поэтому значения стенда описываются здесь,
# а не правкой общего файла.
# ─────────────────────────────────────────────────────────────────────────────

[common]
ASPNETCORE_ENVIRONMENT=Development
RabbitMq__Host=localhost
RabbitMq__Port=${MARS_PORT_RABBITMQ}
RabbitMq__UserName=${RABBITMQ_USER}
RabbitMq__Password=${RABBITMQ_PASSWORD}
ServiceAuth__ApiKey=${SERVICE_API_KEY}
ApplicationInsights__ConnectionString=${APPINSIGHTS_CONNECTION_STRING}
Otlp__Endpoint=http://localhost:${MARS_PORT_TEMPO_OTLP_GRPC}

# Автостарт инфраструктуры при отладке на хосте (Dev:AutoStartInfra). Секции Dev
# нет в appsettings.json намеренно: там автостарт включился бы и в контейнере, а
# стенд разработки поднимается в контейнерах с ASPNETCORE_ENVIRONMENT=Development,
# то есть одного IsDevelopment() мало. Профиль — единственное место, которое
# видит только запуск на хосте (F5 и scripts/*/local -Run).
#
# Списки служб — те же имена, что у `local -Run` (scripts/*/common:
# $script:MarsInfraServices / MARS_INFRA_SERVICES): иначе два пути запуска на
# хосте поднимали бы разные наборы. Сверку держит LocalLaunchSettingsTests.
Dev__AutoStartInfra=true
# postgres и rabbitmq — блокирующе (--wait): без них сервис падает на миграциях.
Dev__InfraServices=postgres,rabbitmq
# Наблюдаемость — фоном и без --wait: недоступный образ Grafana не должен
# срывать запуск сервиса.
Dev__InfraBackgroundServices=tempo,prometheus,grafana,loki,alloy
Dev__InfraWaitTimeoutSeconds=600

# Адреса соседей. Те же имена, что в ServiceEndpoints, и те же хостовые порты,
# что публикует стенд разработки: сервис, поднятый на хосте, ходит к соседям
# через localhost, а не по имени контейнера.
ServiceEndpoints__TwitchCore=http://localhost:${MARS_PORT_TWITCH_CORE}
ServiceEndpoints__WaifuGacha=http://localhost:${MARS_PORT_WAIFU_GACHA}
ServiceEndpoints__Shikimori=http://localhost:${MARS_PORT_SHIKIMORI}
ServiceEndpoints__Telegram=http://localhost:${MARS_PORT_TELEGRAM}
ServiceEndpoints__Discord=http://localhost:${MARS_PORT_DISCORD}
ServiceEndpoints__Commands=http://localhost:${MARS_PORT_COMMANDS}
ServiceEndpoints__SoundRequest=http://localhost:${MARS_PORT_SOUND_REQUEST}
ServiceEndpoints__TTS=http://localhost:${MARS_PORT_TTS}
ServiceEndpoints__OBS=http://localhost:${MARS_PORT_OBS}
ServiceEndpoints__Alerts=http://localhost:${MARS_PORT_ALERTS}
ServiceEndpoints__Scoreboard=http://localhost:${MARS_PORT_SCOREBOARD}
ServiceEndpoints__CinemaQueue=http://localhost:${MARS_PORT_CINEMA_QUEUE}
ServiceEndpoints__MediaStorage=http://localhost:${MARS_PORT_MEDIA_STORAGE}
ServiceEndpoints__Admin=http://localhost:${MARS_PORT_ADMIN}

# gRPC-адреса. Свойством в ServiceEndpoints их держать нельзя: Swagger-агрегатор
# строит карту рефлексией по строковым свойствам и полез бы за спекой на порт,
# который обслуживает только HTTP/2, — поэтому адреса живут в секции Grpc.
Grpc__Endpoints__Alerts=http://localhost:${MARS_PORT_ALERTS_GRPC}
Grpc__Endpoints__OBS=http://localhost:${MARS_PORT_OBS_GRPC}
Grpc__Endpoints__Scoreboard=http://localhost:${MARS_PORT_SCOREBOARD_GRPC}
Grpc__Endpoints__SoundRequest=http://localhost:${MARS_PORT_SOUND_REQUEST_GRPC}
Grpc__Endpoints__TTS=http://localhost:${MARS_PORT_TTS_GRPC}

[MARS.TwitchCore]
port=${MARS_PORT_TWITCH_CORE}
ConnectionStrings__TwitchDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_twitch;Username=mars_twitch;Password=${MARS_TWITCH_PASSWORD}
#secrets Twitch__ClientId Twitch__Secret Twitch__OAuth

[MARS.WaifuGacha]
port=${MARS_PORT_WAIFU_GACHA}
ConnectionStrings__WaifuDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_waifu;Username=mars_waifu;Password=${MARS_WAIFU_PASSWORD}

[MARS.Telegram]
port=${MARS_PORT_TELEGRAM}
ConnectionStrings__ChatDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_chat;Username=mars_chat;Password=${MARS_CHAT_PASSWORD}
Matoi__BaseUrl=http://localhost:${MARS_PORT_MATOI}
Matoi__ApiKey=${MATOI_API_KEY}
Matoi__DefaultProvider=${MATOI_DEFAULT_PROVIDER}

# У MARS.Discord настроек, отличных от общих, нет: база и адреса соседей
# приходят из common.
[MARS.Discord]
port=${MARS_PORT_DISCORD}

[MARS.Commands]
port=${MARS_PORT_COMMANDS}
# AudioController живёт на хосте вне Docker (Windows-громкость), поэтому и
# контейнеры, и хост обращаются к нему по localhost:30695.
AudioController__BaseUrl=http://localhost:30695

[MARS.SoundRequest]
port=${MARS_PORT_SOUND_REQUEST}
ConnectionStrings__MediaDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_media;Username=mars_media;Password=${MARS_MEDIA_PASSWORD}
Grpc__HttpPort=${MARS_PORT_SOUND_REQUEST}
Grpc__GrpcPort=${MARS_PORT_SOUND_REQUEST_GRPC}

[MARS.TTS]
port=${MARS_PORT_TTS}
Grpc__HttpPort=${MARS_PORT_TTS}
Grpc__GrpcPort=${MARS_PORT_TTS_GRPC}

[MARS.OBS]
port=${MARS_PORT_OBS}
Grpc__HttpPort=${MARS_PORT_OBS}
Grpc__GrpcPort=${MARS_PORT_OBS_GRPC}

[MARS.Videos365]
port=${MARS_PORT_VIDEOS365}
ConnectionStrings__Videos365Db=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_videos365;Username=mars_videos365;Password=${MARS_VIDEOS365_PASSWORD}
Config365__Site=${CONFIG365_SITE}
Config365__Login=${CONFIG365_LOGIN}
Config365__TelegramChannelId=${CONFIG365_TELEGRAM_CHANNEL_ID}
#secrets Config365__Password Telegram__BotToken Telegram__AdminIds__0

[MARS.Shikimori]
port=${MARS_PORT_SHIKIMORI}
ConnectionStrings__ShikimoriDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_shikimori;Username=mars_shikimori;Password=${MARS_SHIKIMORI_PASSWORD}
Shikimori__ShikimoriSite=${SHIKIMORI_SITE}
#secrets Shikimori__ClientName Shikimori__ClientId Shikimori__ClientSecret

[MARS.Alerts]
port=${MARS_PORT_ALERTS}
ConnectionStrings__AlertsDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_alerts;Username=mars_alerts;Password=${MARS_ALERTS_PASSWORD}
Matoi__BaseUrl=http://localhost:${MARS_PORT_MATOI}
Matoi__ApiKey=${MATOI_API_KEY}
Matoi__DefaultProvider=${MATOI_DEFAULT_PROVIDER}
AudioController__BaseUrl=http://localhost:30695
# Файлы алертов (<корень>/Alerts) — тот же корень, что у MARS.MediaStorage: в
# контейнере это общий том mars-wwwroot, и локальная отладка воспроизводит его
# одной папкой репозитория. Подробнее — в блоке MARS.MediaStorage и в .gitignore.
ASPNETCORE_WEBROOT=../../data/local-wwwroot
Grpc__HttpPort=${MARS_PORT_ALERTS}
Grpc__GrpcPort=${MARS_PORT_ALERTS_GRPC}
#secrets WTelegram__AllowedChannelIds__0

[MARS.Scoreboard]
port=${MARS_PORT_SCOREBOARD}
ConnectionStrings__ScoreboardDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_scoreboard;Username=mars_scoreboard;Password=${MARS_SCOREBOARD_PASSWORD}
Grpc__HttpPort=${MARS_PORT_SCOREBOARD}
Grpc__GrpcPort=${MARS_PORT_SCOREBOARD_GRPC}

[MARS.CinemaQueue]
port=${MARS_PORT_CINEMA_QUEUE}
ConnectionStrings__CinemaDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_cinema;Username=mars_cinema;Password=${MARS_CINEMA_PASSWORD}

[MARS.MediaStorage]
port=${MARS_PORT_MEDIA_STORAGE}
ConnectionStrings__MediaStorageDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_mediastorage;Username=mars_mediastorage;Password=${MARS_MEDIASTORAGE_PASSWORD}
MediaGit__Enabled=${MEDIA_GIT_ENABLED}
MediaGit__RepositoryUrl=${MEDIA_GIT_REPOSITORY_URL}
MediaGit__Branch=${MEDIA_GIT_BRANCH}
MediaGit__Username=${MEDIA_GIT_USERNAME}
MediaStorage__MaxUploadSizeMb=${MEDIA_STORAGE__MAXUPLOAD_SIZEMB}
MediaStorage__TrashRetentionDays=${MEDIA_STORAGE__TRASHRETENTIONDAYS}
# Корень раздачи файлов. Значение то же, что у MARS.Alerts: в контейнере конвейер
# «алерт → файл в Alerts/» пересекает оба сервиса через том mars-wwwroot, и с
# отдельными папками локальный запуск двух сервисов молча расходился бы — файл
# алерта писался бы в одну, а раздача искала в другой.
#
# ASPNETCORE_WEBROOT — host-настройка (как ASPNETCORE_ENVIRONMENT рядом), поэтому
# она не требует кода в сервисе: WebRootPath читают и раздача статики, и
# MediaStorageService, и MediaGitService. Своя настройка вида
# MediaStorage__RootPath его не заменит: builder.WebHost.UseWebRoot в
# WebApplicationBuilder бросает NotSupportedException, а через
# WebApplicationOptions потребовался бы второй разбор конфигурации.
#
# Путь относительный и на два уровня вверх: корень содержимого у F5 — каталог
# проекта (src/<сервис>), поэтому ../../ от него — корень репозитория, один для
# всех сервисов. Абсолютный путь здесь был бы путём машины автора.
ASPNETCORE_WEBROOT=../../data/local-wwwroot
#secrets MediaGit__Token Telegram__BotToken Telegram__AdminIds__0

[MARS.Admin]
port=${MARS_PORT_ADMIN}
ConnectionStrings__AdminDb=Host=localhost;Port=${MARS_PORT_POSTGRES};Database=mars_admin;Username=mars_admin;Password=${MARS_ADMIN_PASSWORD}

# Gateway на хосте проксирование не поднимает: адреса YARP-кластеров указывают
# на имена контейнеров, а профиль их не переписывает. Профиль всё равно полезен —
# он даёт ServiceEndpoints для агрегатора Swagger, — но для отладки проксирования
# Gateway остаётся в контейнере, а маршрут направляют на хост правкой адреса
# кластера, а не запуском всего шлюза локально.
[MARS.Gateway]
port=${MARS_PORT_GATEWAY}

# MARS.AudioController — единственный сервис, который НЕ контейнеризуется: он
# управляет микшером Windows. Порт у него не из схемы стенда, а свой (30695), и
# общий блок ему тоже не нужен целиком, но вреда от него нет: адреса и брокер
# он просто не читает.
[MARS.AudioController]
port=30695
