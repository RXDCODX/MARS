# DBHub configuration for MARS project databases.
# Postgres runs in docker-compose (dev) on host port 6017.
# Superuser credentials are dev-only (mars/mars).

[[sources]]
id = "mars"
description = "Base MARS database"
dsn = "postgres://mars:mars@localhost:6017/mars"
lazy = true

[[sources]]
id = "mars_twitch"
description = "Twitch module database"
dsn = "postgres://mars:mars@localhost:6017/mars_twitch"
lazy = true

[[sources]]
